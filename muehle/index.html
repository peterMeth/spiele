<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2c2420">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<title>Mühle</title>
<style>
/* VOICE: traditional, unhurried.  IDEA: the reverse side of a wooden game box: inlaid lines on light wood.
   PICTURE: the three nested squares with dots, white and black stones, stones in hand at the edges.
   COLOUR/TYPE: dark leather table, light birch board, dark inlay lines, ivory and ebony.  LAYOUT: icons, status, board centred, footer. */
:root{color-scheme:dark;--bg:#2c2420;--ink:#f4ece2;--muted:#c4b6a6;--lib-panel:#3a302a;--lib-edge:#55473e;--lib-ink:#f4ece2;--lib-muted:#c4b6a6;--lib-acc:#d9a441;--lib-acc-ink:#2a1d08}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,Roboto,sans-serif;overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.top{display:flex;gap:8px;padding:8px 10px 4px;max-width:640px;width:100%;margin:0 auto}
.st{text-align:center;font:700 22px/1.2 "Roboto Condensed","Arial Narrow",sans-serif-condensed,system-ui;padding:4px 10px;min-height:34px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.35)}
.stage{flex:1;position:relative;min-height:0;touch-action:none}
canvas{position:absolute;display:block;touch-action:none}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 14px 12px;max-width:640px;width:100%;margin:0 auto;color:var(--muted);font-weight:600}
.foot button{white-space:nowrap;font:600 15px system-ui,Roboto,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--lib-edge);background:var(--lib-panel);color:var(--ink)}
</style>
</head>
<body>
<div class="top" id="icons"></div>
<div class="st" id="st"></div>
<div class="stage" id="stage"><canvas id="c"></canvas></div>
<div class="foot"><span id="count"></span><button id="again">Neue Partie</button></div>
<script src="../lib.js"></script>
<script>
{
const L=Lib,$=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),stage=$('stage');
// Punkte: 3 Ringe à 8 Punkte, im Uhrzeigersinn ab oben links
const RING=[[0,0],[3,0],[6,0],[6,3],[6,6],[3,6],[0,6],[0,3]];
const PT=[];for(let r=0;r<3;r++)RING.forEach(([x,y])=>PT.push([r+(x/3)*(3-r),r+(y/3)*(3-r)]));
const ADJ=PT.map(()=>[]);const link=(a,b)=>{ADJ[a].push(b);ADJ[b].push(a)};
for(let r=0;r<3;r++)for(let k=0;k<8;k++)link(r*8+k,r*8+(k+1)%8);
for(const k of[1,3,5,7]){link(k,8+k);link(8+k,16+k)}
const MILLS=[];for(let r=0;r<3;r++)for(let s=0;s<4;s++)MILLS.push([r*8+2*s,r*8+2*s+1,r*8+(2*s+2)%8]);
for(const k of[1,3,5,7])MILLS.push([k,8+k,16+k]);
const MAT=PT.map((_,i)=>MILLS.filter(m=>m.includes(i)));

let b=[],hand=[9,9],turn=0,over=true,busy=false,ui='pick',selFrom=-1,pending=[],legal=[],last=null,quiet=0,score=[0,0],starter=0,set,u=40,off=20;
const names=()=>set.mode?['Weiß','Schwarz']:['Du','PC'];
const isAI=p=>set.mode===0&&p===1;
const cnt=(bd,p)=>bd.reduce((n,v)=>n+(v===p),0);
const inMill=(bd,i)=>MAT[i].some(m=>m.every(j=>bd[j]===bd[i]));
const phase=(bd,h,p)=>h[p]>0?'place':cnt(bd,p)===3?'fly':'move';

function gen(bd,h,p){
  const ph=phase(bd,h,p),out=[],pairs=[];
  if(ph==='place'){for(let i=0;i<24;i++)if(bd[i]<0)pairs.push([-1,i])}
  else for(let i=0;i<24;i++)if(bd[i]===p){const ts=ph==='fly'?[...Array(24).keys()]:ADJ[i];for(const t of ts)if(bd[t]<0)pairs.push([i,t])}
  for(const[f,t]of pairs){
    if(f>=0)bd[f]=-1;bd[t]=p;
    const mill=MAT[t].some(m=>m.every(j=>bd[j]===p));
    if(mill){const opp=[];for(let i=0;i<24;i++)if(bd[i]===1-p)opp.push(i);let rem=opp.filter(i=>!inMill(bd,i));if(!rem.length)rem=opp;
      if(!rem.length)out.push({f,t,r:-1});else rem.forEach(r=>out.push({f,t,r}))}
    else out.push({f,t,r:-1});
    bd[t]=-1;if(f>=0)bd[f]=p;
  }
  return out;
}
function apply(bd,h,m,p){const nb=bd.slice(),nh=h.slice();if(m.f<0)nh[p]--;else nb[m.f]=-1;nb[m.t]=p;if(m.r>=0)nb[m.r]=-1;return[nb,nh]}
function lost(bd,h,p){if(cnt(bd,p)+h[p]<3)return true;if(h[p]===0&&!gen(bd,h,p).length)return true;return false}
function evalB(bd,h,p){const o=1-p;let s=(cnt(bd,p)+h[p]-cnt(bd,o)-h[o])*100;
  for(const m of MILLS){let a=0,c=0;for(const j of m){if(bd[j]===p)a++;else if(bd[j]===o)c++}if(c===0&&a===2)s+=6;if(a===0&&c===2)s-=6;if(a===3)s+=3;if(c===3)s-=3}
  if(h[p]===0&&h[o]===0){let mp=0,mo=0;for(let i=0;i<24;i++){if(bd[i]===p)mp+=ADJ[i].filter(t=>bd[t]<0).length;else if(bd[i]===o)mo+=ADJ[i].filter(t=>bd[t]<0).length}s+=(mp-mo)*2}
  return s}
function negamax(bd,h,d,a,bt,p){
  if(lost(bd,h,p))return -100000-d;if(d===0)return evalB(bd,h,p);
  let best=-1e9;const ms=gen(bd,h,p);ms.sort((x,y)=>(y.r>=0)-(x.r>=0));
  for(const m of ms){const[nb,nh]=apply(bd,h,m,p);const v=-negamax(nb,nh,d-1,-bt,-a,1-p);if(v>best)best=v;if(best>a)a=best;if(a>=bt)break}
  return best}
function aiPick(){
  const ms=gen(b,hand,1);if(set.diff===0&&Math.random()<.4)return ms[Math.floor(Math.random()*ms.length)];
  const d=[2,3,4][set.diff];let best=-1e9,bm=[];
  for(const m of ms){const[nb,nh]=apply(b,hand,m,1);const v=-negamax(nb,nh,d-1,-1e9,1e9,0);if(v>best){best=v;bm=[m]}else if(v===best)bm.push(m)}
  return bm[Math.floor(Math.random()*bm.length)]}

// ---------- flow ----------
function status(txt){
  const n=names();$('count').textContent=`Steine ${cnt(b,0)+hand[0]}:${cnt(b,1)+hand[1]} · Partien ${score[0]}:${score[1]}`;
  if(txt){$('st').innerHTML=txt;return}
  const ph=phase(b,hand,turn),who=isAI(turn)?'PC denkt …':(set.mode?n[turn]+': ':'');
  const what=isAI(turn)?'':ui==='remove'?'Mühle! Nimm einen gegnerischen Stein':ph==='place'?`Setze einen Stein (${hand[turn]} übrig)`:ph==='fly'?'Springe mit einem Stein':'Ziehe einen Stein';
  $('st').innerHTML=`<span class="dot" style="background:${turn?'#1a1614':'#f4ead8'}"></span>${who}${what}`;
}
function newGame(){b=Array(24).fill(-1);hand=[9,9];turn=starter;over=false;busy=false;ui='pick';selFrom=-1;last=null;quiet=0;L.orient('portrait');next()}
function next(){
  legal=gen(b,hand,turn);
  if(lost(b,hand,turn)){over=true;const w=1-turn,n=names();score[w]++;if(!set.mode)L.record('muehle',w===0);
    status(set.mode?`${n[w]} gewinnt!`:(w===0?'Du gewinnst!':'Der PC gewinnt'));L.beep(w===0||set.mode?880:220,.35,'triangle',.06,w===0||set.mode?1.5:.6);starter=1-starter;return}
  if(quiet>=60){over=true;status('Remis – 30 Züge ohne Mühle');starter=1-starter;return}
  ui='pick';selFrom=-1;status();
  if(isAI(turn)){busy=true;setTimeout(()=>play(aiPick()),400)}
}
function play(m){
  [b,hand]=apply(b,hand,m,turn);last=m;busy=false;
  if(m.r>=0){quiet=0;L.beep(150,.15,'square',.07);L.vib(30)}else{L.beep(m.f<0?520:420,.05,'triangle',.04);if(hand[0]+hand[1]===0)quiet++}
  turn=1-turn;next();
}

// ---------- drawing ----------
function fit(){
  const r=stage.getBoundingClientRect(),dpr=window.devicePixelRatio||1,s=Math.min(r.width-12,r.height-4);
  u=s/8.2;off=u*.55;const w=s;
  cv.style.width=w+'px';cv.style.height=w+'px';cv.style.left=(r.width-w)/2+'px';cv.style.top=(r.height-w)/2+'px';
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(fit).observe(stage);
const X=i=>off+u*.55+PT[i][0]*u,Y=i=>off+u*.55+PT[i][1]*u;
function stone(x,y,p,R=u*.36,a=1){ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.arc(x+2,y+3,R,0,7);ctx.fill();
  const g=ctx.createRadialGradient(x-R*.3,y-R*.4,R*.1,x,y,R);g.addColorStop(0,p?'#575049':'#fffdf6');g.addColorStop(1,p?'#1a1614':'#e2d4b8');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill();ctx.globalAlpha=1}
function draw(){
  const W=cv.width/(window.devicePixelRatio||1);ctx.clearRect(0,0,W,W);
  const bx=off,bs=u*7.1;
  ctx.fillStyle='#e8d2a8';ctx.beginPath();ctx.roundRect?ctx.roundRect(bx,bx,bs,bs,u*.25):ctx.rect(bx,bx,bs,bs);ctx.fill();
  ctx.strokeStyle='#4a3424';ctx.lineWidth=Math.max(2,u*.08);
  for(let r=0;r<3;r++){ctx.beginPath();for(let k=0;k<=8;k++){const i=r*8+k%8;k?ctx.lineTo(X(i),Y(i)):ctx.moveTo(X(i),Y(i))}ctx.stroke()}
  for(const k of[1,3,5,7]){ctx.beginPath();ctx.moveTo(X(k),Y(k));ctx.lineTo(X(16+k),Y(16+k));ctx.stroke()}
  ctx.fillStyle='#4a3424';for(let i=0;i<24;i++){ctx.beginPath();ctx.arc(X(i),Y(i),u*.11,0,7);ctx.fill()}
  if(last){ctx.strokeStyle='rgba(217,164,65,.9)';ctx.lineWidth=3;
    if(last.f>=0){ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(X(last.f),Y(last.f),u*.3,0,7);ctx.stroke();ctx.setLineDash([])}
    if(last.r>=0){ctx.strokeStyle='rgba(200,60,40,.9)';const x=X(last.r),y=Y(last.r),s=u*.18;ctx.beginPath();ctx.moveTo(x-s,y-s);ctx.lineTo(x+s,y+s);ctx.moveTo(x+s,y-s);ctx.lineTo(x-s,y+s);ctx.stroke()}}
  const pm=ui==='remove'&&pending[0];if(pm)stone(X(pm.t),Y(pm.t),turn);
  for(let i=0;i<24;i++)if(b[i]>=0&&!(pm&&pm.f===i)){stone(X(i),Y(i),b[i]);if(inMill(b,i)){ctx.strokeStyle='rgba(217,164,65,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(X(i),Y(i),u*.42,0,7);ctx.stroke()}}
  if(last){ctx.strokeStyle='#d9a441';ctx.lineWidth=3;ctx.beginPath();ctx.arc(X(last.t),Y(last.t),u*.44,0,7);ctx.stroke()}
  // stones in hand: player 1 above, player 0 below the board
  for(let p=0;p<2;p++)for(let k=0;k<hand[p];k++)stone(off+u*.4+k*u*.62,p?off*.5:W-off*.5,p,u*.24);
  if(!over&&!busy&&!isAI(turn)){
    ctx.fillStyle='rgba(217,164,65,.85)';ctx.strokeStyle='#d9a441';ctx.lineWidth=3;
    if(ui==='remove')pending.forEach(m=>{ctx.beginPath();ctx.arc(X(m.r),Y(m.r),u*.42,0,7);ctx.stroke()});
    else if(selFrom>=0){ctx.beginPath();ctx.arc(X(selFrom),Y(selFrom),u*.44,0,7);ctx.stroke();
      new Set(legal.filter(m=>m.f===selFrom).map(m=>m.t)).forEach(t=>{ctx.beginPath();ctx.arc(X(t),Y(t),u*.16,0,7);ctx.fill()})}
    else if(phase(b,hand,turn)!=='place'){ctx.strokeStyle='rgba(217,164,65,.5)';new Set(legal.map(m=>m.f)).forEach(f=>{ctx.beginPath();ctx.arc(X(f),Y(f),u*.42,0,7);ctx.stroke()})}
  }
}
(function loop(){if(b.length)draw();requestAnimationFrame(loop)})();

// ---------- input ----------
cv.addEventListener('pointerup',e=>{
  if(over||busy||isAI(turn))return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  let i=-1,bd=u*.5;for(let k=0;k<24;k++){const d=Math.hypot(X(k)-x,Y(k)-y);if(d<bd){bd=d;i=k}}if(i<0)return;
  if(ui==='remove'){const m=pending.find(m=>m.r===i);if(m)play(m);return}
  let cands;
  if(phase(b,hand,turn)==='place')cands=legal.filter(m=>m.t===i);
  else{if(b[i]===turn&&legal.some(m=>m.f===i)){selFrom=i;L.beep(700,.03,'sine',.03);return}
    if(selFrom<0)return;cands=legal.filter(m=>m.f===selFrom&&m.t===i)}
  if(!cands.length){return}
  if(cands.some(m=>m.r>=0)){pending=cands;ui='remove';status();return}
  play(cands[0]);
});
$('again').onclick=()=>newGame();

const menu=L.menu({prefix:'muehle_',title:'Mühle',
  text:'Setzt abwechselnd je 9 Steine, dann wird gezogen. Drei in einer Linie sind eine Mühle: Dann darfst du einen gegnerischen Stein wegnehmen. Mit nur noch 3 Steinen darf man springen. Wer unter 3 Steine fällt oder nicht mehr ziehen kann, verliert.',
  rows:[{key:'mode',label:'Modus',opts:[['Gegen PC',0],['1 vs 1',1]],def:0},{key:'diff',label:'PC',opts:[['Leicht',0],['Mittel',1],['Schwer',2]],def:1,showIf:s=>s.mode===0}],
  onStart:()=>{score=[0,0];starter=0;newGame()}});
set=menu.settings;
L.icons($('icons'),{onMenu:()=>{over=true;menu.show()},orient:'portrait'});
b=Array(24).fill(-1);status(' ');fit();
}
</script>
</body>
</html>
