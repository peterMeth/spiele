<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f332e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<title>Snake</title>
<style>
/* VOICE: nostalgic, tactile, quick — the snake from an old phone.
   IDEA: the phone becomes a classic handset: grey bezel, pea-green LCD with pixel grid, keypad below.
   PICTURE: the LCD play field with blocky snake, food and blinking bonus.
   COLOUR and TYPE: bezel graphite, LCD green, dark pixel ink; condensed system type for score (offline-safe).
   LAYOUT: score strip with icon keys, LCD fills the middle, full-width arrow pad at the bottom. */
:root{color-scheme:light dark;--bg:light-dark(#dfe3d6,#121410);--ink:light-dark(#1e231b,#e8ecdf);--muted:light-dark(#5d6656,#a3ad97);
  --bezel:#2f332e;--bezel2:#3d423b;--lcd:#b8c49a;--px:#233018;--key:#4a5047;--keyhi:#5c6358;--accent:#c4d36b;
  --cond:"Roboto Condensed","Arial Narrow",sans-serif-condensed,system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,Roboto,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);user-select:none;-webkit-user-select:none}
.phone{flex:1;display:flex;flex-direction:column;width:100%;max-width:520px;background:var(--bezel);border-radius:28px;margin:8px 0;padding:14px 14px 16px;
  box-shadow:inset 0 2px 0 var(--bezel2),0 16px 40px rgba(0,0,0,.35);min-height:0}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:0 4px 10px}
.sc{font:700 30px/1 var(--cond);font-stretch:condensed;font-variant-numeric:tabular-nums;color:#eef3e2}
.sc small{display:block;font:500 12px/1.2 system-ui,sans-serif;color:#9aa38f}
.hi{text-align:right}
.icons{display:flex;gap:8px}
.screen{flex:1;position:relative;background:var(--lcd);border-radius:10px;box-shadow:inset 0 3px 10px rgba(0,0,0,.35);touch-action:none;min-height:0;overflow:hidden}
canvas{position:absolute;display:block;touch-action:none}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:16px}
.msg{pointer-events:auto;color:var(--px);text-align:center;background:rgba(184,196,154,.94);border:3px solid var(--px);border-radius:6px;padding:18px 18px;width:min(290px,100%)}
.msg h2{font:700 36px/1 var(--cond);font-stretch:condensed;margin:0 0 6px}
.msg p{margin:0 0 12px;font-size:15px}
.msg[hidden],.lv[hidden]{display:none}
.lvl{font-weight:700;font-size:14px;margin:0 0 6px}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.lv button{background:transparent;color:var(--px);border:2px solid var(--px);box-shadow:none;font:700 22px/1 var(--cond);min-height:46px;border-radius:6px}
.lv button[aria-pressed=true]{background:var(--px);color:var(--lcd)}
button{font:600 15px system-ui,Roboto,sans-serif;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:var(--key);color:#eef3e2;cursor:pointer;
  box-shadow:inset 0 1px 0 var(--keyhi),0 3px 0 #1d201c;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--keyhi),0 1px 0 #1d201c}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[hidden]{display:none}
.ico{width:48px;padding:0;display:grid;place-items:center}
a.ico{min-height:44px;border-radius:12px;background:var(--key);box-shadow:inset 0 1px 0 var(--keyhi),0 3px 0 #1d201c}
.ico svg{width:24px;height:24px}
.go{background:var(--px);color:var(--lcd);width:100%;box-shadow:none;border-radius:6px}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,clamp(52px,8.5vh,76px));gap:6px;padding-top:14px}
.pad button{padding:0;border-radius:14px;display:grid;place-items:center}
.pad svg{width:34%;max-width:34px;height:auto;fill:#eef3e2}
.pad .u{grid-area:1/1/2/4}.pad .l{grid-area:2/1}.pad .r{grid-area:2/3}.pad .d{grid-area:3/1/4/4}
.pad .mid{grid-area:2/2;border-radius:50%;width:28px;height:28px;margin:auto;background:#262a25}
.hint{font-size:12px;color:var(--muted);margin:0 0 6px;text-align:center}
@media(max-height:640px){.phone{padding:10px}.pad{padding-top:10px}}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <div class="sc" id="score">0<small>Punkte · Level <b id="lvShow">7</b></small></div>
    <div class="icons">
      <a class="ico" href="../" aria-label="Zur Spieleübersicht">
        <svg viewBox="0 0 24 24" fill="none" stroke="#eef3e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg>
      </a>
      <button class="ico" id="snd" aria-label="Ton aus" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#eef3e2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9h4l5-4v14l-5-4H4z" fill="#eef3e2"/>
          <g id="waves"><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></g>
          <g id="mute" style="display:none"><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></g>
        </svg>
      </button>
      <button class="ico" id="fs" aria-label="Vollbild" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="#eef3e2" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
    <div class="sc hi" id="hi">0<small>Rekord</small></div>
  </div>
  <div class="screen" id="screen">
    <canvas id="c"></canvas>
    <div class="over"><div class="msg" id="msg">
      <h2 id="mt">Snake</h2>
      <p id="mp">Wisch über das Display oder nimm die Pfeiltasten. Beiß dich nicht selbst und fahr nicht gegen den Rand.</p>
      <div id="lvWrap"><p class="lvl">Level wählen</p><div class="lv" id="lv"></div></div>
      <button class="go" id="go">Spiel starten</button>
    </div></div>
  </div>
  <div class="pad" aria-label="Pfeiltasten">
    <button class="u" data-dir="0,-1" aria-label="Hoch"><svg viewBox="0 0 24 14"><path d="M12 0l12 14H0z"/></svg></button>
    <button class="l" data-dir="-1,0" aria-label="Links"><svg viewBox="0 0 14 24" style="width:22%"><path d="M0 12L14 0v24z"/></svg></button>
    <span class="mid"></span>
    <button class="r" data-dir="1,0" aria-label="Rechts"><svg viewBox="0 0 14 24" style="width:22%"><path d="M14 12L0 0v24z"/></svg></button>
    <button class="d" data-dir="0,1" aria-label="Runter"><svg viewBox="0 0 24 14"><path d="M12 14L24 0H0z"/></svg></button>
  </div>
</div>
<p class="hint">Tastatur: Pfeiltasten oder WASD, Leertaste hält an</p>
<script>
{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),screenEl=$('screen');
const COLS=18,ROWS=26,PX='#233018',GHOST='rgba(35,48,24,.07)';
const msFor=l=>220-(l-1)*20; // Level 1 = 220 ms pro Schritt … Level 9 = 60 ms
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let level=7,sound=(store.get('snake_sound')??'1')==='1';
let hi=+(store.get('snake_hi')||0);
let cell=10,state='ready',snake=[],dir={x:1,y:0},queue=[],food=null,bonus=null,eaten=0,score=0,tickMs=100,acc=0,last=0,ac=null,grow=0;

function fit(){
  const r=screenEl.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cell=Math.max(4,Math.floor(Math.min((r.width-8)/COLS,(r.height-8)/ROWS)));
  const w=cell*COLS,h=cell*ROWS,ox=Math.floor((r.width-w)/2),oy=Math.floor((r.height-h)/2);
  cv.style.left=ox+'px';cv.style.top=oy+'px';cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw();
}
const ro=new ResizeObserver(fit);ro.observe(screenEl);

function beep(f,d,type='square'){
  if(!sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}
}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

function free(){
  const occ=new Set(snake.map(s=>s.x+','+s.y));if(food)occ.add(food.x+','+food.y);if(bonus)occ.add(bonus.x+','+bonus.y);
  const opts=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(!occ.has(x+','+y))opts.push({x,y});
  return opts.length?opts[Math.floor(Math.random()*opts.length)]:null;
}
function setScore(){store.set('stat_snake',`Rekord ${hi} Punkte`);$('score').firstChild.textContent=score;$('hi').firstChild.textContent=hi;$('lvShow').textContent=level}
function show(t,txt,btn,pick){$('mt').textContent=t;$('mp').textContent=txt;$('go').textContent=btn;$('lvWrap').hidden=!pick;$('msg').hidden=false}

// level picker 1–9, 7 preselected
const lvEl=$('lv');
lvEl.innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-l="${n}" aria-pressed="${n===level}">${n}</button>`).join('');
const lvBtns=[...lvEl.children];
function setLevel(n){level=n;lvBtns.forEach(b=>b.setAttribute('aria-pressed',+b.dataset.l===n));setScore()}
lvBtns.forEach(b=>b.addEventListener('click',()=>setLevel(+b.dataset.l)));

function newGame(){
  const y=Math.floor(ROWS/2);snake=[{x:6,y},{x:5,y},{x:4,y}];dir={x:1,y:0};queue=[];grow=0;
  score=0;eaten=0;bonus=null;tickMs=msFor(level);food=null;food=free();setScore();
}
function start(){
  if(ac&&ac.state==='suspended')ac.resume();
  try{screen.orientation.lock('portrait').catch(()=>{})}catch(e){}
  if(state==='ready'||state==='over')newGame();
  $('msg').hidden=true;state='play';last=performance.now();acc=0;requestAnimationFrame(loop);
}
function pause(){
  if(state==='play'){state='pause';show('Pause',`${score} Punkte, Länge ${snake.length}.`,'Weiter',false)}
  else if(state==='pause')start();
}
function turn(x,y){
  if(state==='pause')start();
  if(state!=='play')return;
  const ref=queue.length?queue[queue.length-1]:dir;
  if((x===-ref.x&&y===-ref.y)||(x===ref.x&&y===ref.y))return;
  if(queue.length<3)queue.push({x,y});
}

function die(){
  state='over';beep(140,.4,'sawtooth');vib([60,40,120]);
  const rec=score>hi;if(rec){hi=score;store.set('snake_hi',hi)}setScore();
  show(rec?'Neuer Rekord!':'Game Over',`${score} Punkte auf Level ${level}, Schlange war ${snake.length} lang.`,'Noch mal',true);
}
function tick(){
  if(queue.length)dir=queue.shift();
  const h=snake[0],nx=h.x+dir.x,ny=h.y+dir.y;
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS)return die();
  const tailMoves=grow===0;
  for(let i=0;i<snake.length-(tailMoves?1:0);i++)if(snake[i].x===nx&&snake[i].y===ny)return die();
  snake.unshift({x:nx,y:ny});
  if(food&&nx===food.x&&ny===food.y){
    eaten++;score+=level;grow+=1;beep(880,.05);vib(15);
    tickMs=Math.max(msFor(level)*.6,tickMs*.99);
    food=free();
    if(eaten%5===0&&!bonus){const p=free();if(p)bonus={...p,t:Math.round(5000/tickMs)}}
  }
  if(bonus&&nx===bonus.x&&ny===bonus.y){score+=5*level+bonus.t;grow+=2;bonus=null;beep(1250,.12,'triangle');vib(30)}
  if(bonus&&--bonus.t<=0)bonus=null;
  if(grow>0)grow--;else snake.pop();
  setScore();
  if(!food&&!bonus){state='over';if(score>hi){hi=score;store.set('snake_hi',hi)}setScore();show('Durchgespielt!','Das ganze Display ist voll. Respekt.','Noch mal',true)}
}

function blk(x,y,inset){const c=cell,g=Math.max(1,Math.round(c*.08));ctx.fillRect(x*c+g+inset,y*c+g+inset,c-2*g-2*inset,c-2*g-2*inset)}
function draw(){
  const w=cell*COLS,h=cell*ROWS;ctx.clearRect(0,0,w,h);
  ctx.fillStyle=GHOST;for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)blk(x,y,0);
  ctx.strokeStyle=PX;ctx.lineWidth=2;ctx.strokeRect(1,1,w-2,h-2);
  ctx.fillStyle=PX;
  if(state!=='ready'){
    if(food){const c=cell;ctx.beginPath();ctx.arc(food.x*c+c/2,food.y*c+c/2,c*.32,0,7);ctx.fill();ctx.fillRect(food.x*c+c*.48,food.y*c+c*.08,c*.1,c*.2)}
    if(bonus&&(bonus.t>12||bonus.t%2)){const c=cell,x=bonus.x*c,y=bonus.y*c;
      ctx.beginPath();ctx.moveTo(x+c/2,y+c*.1);ctx.lineTo(x+c*.9,y+c/2);ctx.lineTo(x+c/2,y+c*.9);ctx.lineTo(x+c*.1,y+c/2);ctx.closePath();ctx.fill()}
    snake.forEach((s,i)=>blk(s.x,s.y,i===0?0:Math.max(0,Math.round(cell*.04))));
    const hd=snake[0];if(hd){const c=cell,cx=hd.x*c+c/2,cy=hd.y*c+c/2,e=c*.11,px=-dir.y,py=dir.x;
      ctx.fillStyle='#b8c49a';[1,-1].forEach(s=>ctx.fillRect(cx+dir.x*c*.15+px*c*.18*s-e/2,cy+dir.y*c*.15+py*c*.18*s-e/2,e,e))}
  }else{
    const demo=[[4,13],[5,13],[6,13],[7,13],[8,13],[8,12],[8,11],[9,11],[10,11],[11,11],[11,12],[11,13],[11,14],[12,14],[13,14]];
    demo.forEach(([x,y])=>blk(x,y,0));
  }
}
function loop(t){
  if(state!=='play')return draw();
  acc+=Math.min(250,t-last);last=t;
  while(acc>=tickMs&&state==='play'){acc-=tickMs;tick()}
  draw();if(state==='play')requestAnimationFrame(loop);
}

// swipe: a new turn every 22px of finger travel
let sx=null,sy=null;
screenEl.addEventListener('pointerdown',e=>{if(e.target.closest('.msg'))return;sx=e.clientX;sy=e.clientY});
screenEl.addEventListener('pointermove',e=>{
  if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy,th=22;
  if(Math.abs(dx)<th&&Math.abs(dy)<th)return;
  if(Math.abs(dx)>Math.abs(dy))turn(Math.sign(dx),0);else turn(0,Math.sign(dy));
  sx=e.clientX;sy=e.clientY;
});
['pointerup','pointercancel','pointerleave'].forEach(t=>screenEl.addEventListener(t,()=>{sx=sy=null}));
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const[x,y]=b.dataset.dir.split(',').map(Number);turn(x,y)}));
const KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(KEYS[k]){e.preventDefault();turn(...KEYS[k])}
  else if(state!=='play'&&state!=='pause'&&/^[1-9]$/.test(k))setLevel(+k);
  else if(k===' '||k==='Enter'){e.preventDefault();state==='play'||state==='pause'?pause():start()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});
$('go').addEventListener('click',start);

function setSound(v){sound=v;store.set('snake_sound',v?'1':'0');$('waves').style.display=v?'':'none';$('mute').style.display=v?'none':'';
  $('snd').setAttribute('aria-pressed',v);$('snd').setAttribute('aria-label',v?'Ton aus':'Ton an')}
$('snd').addEventListener('click',()=>setSound(!sound));

const fsBtn=$('fs'),root=document.documentElement;
fsBtn.hidden=!(document.fullscreenEnabled||document.webkitFullscreenEnabled)||matchMedia('(display-mode: fullscreen)').matches;
fsBtn.addEventListener('click',async()=>{
  try{if(document.fullscreenElement||document.webkitFullscreenElement)await (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else{await (root.requestFullscreen||root.webkitRequestFullscreen).call(root,{navigationUI:'hide'});try{await screen.orientation.lock('portrait')}catch(e){}}
  }catch(e){fsBtn.hidden=true}
});
document.addEventListener('fullscreenchange',fit);

if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('../sw.js').catch(()=>{})}
setSound(sound);setLevel(level);show('Snake',$('mp').textContent,'Spiel starten',true);fit();
}
</script>
</body>
</html>
