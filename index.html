<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24272b">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Spiele</title>
<style>
/* VOICE: playful but tidy — a shelf of game cartridges.
   IDEA: each game is a cartridge with its own label colour, slotted into a dark console shelf.
   PICTURE: the cartridge list itself, each with the game's own little screen.
   COLOUR and TYPE: graphite shelf, each card coloured by its game; condensed system type for titles.
   LAYOUT: title row, one column of large cartridges, empty slot hinting at more games. */
:root{color-scheme:dark;--bg:#24272b;--shelf:#2e3237;--edge:#3b4046;--ink:#f1f2ee;--muted:#a9afb5;
  --cond:"Roboto Condensed","Arial Narrow",sans-serif-condensed,system-ui,sans-serif}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,Roboto,sans-serif;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font:700 48px/1.05 var(--cond);font-stretch:condensed;margin:0}
.sub{color:var(--muted);font-size:15px;margin:2px 0 0}
.fs{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;border:1px solid var(--edge);background:var(--shelf);color:var(--ink);cursor:pointer}
.fs[hidden]{display:none}
.fs svg{width:24px;height:24px}
.list{display:grid;gap:14px}
.cart{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;text-decoration:none;color:var(--ink);
  background:var(--shelf);border-radius:16px;padding:12px;border-left:10px solid var(--c);
  box-shadow:inset 0 1px 0 var(--edge),0 6px 0 #1a1c1f,0 10px 24px rgba(0,0,0,.3);transition:transform .12s}
.cart:active{transform:translateY(4px);box-shadow:inset 0 1px 0 var(--edge),0 2px 0 #1a1c1f}
.cart:focus-visible{outline:3px solid #ffb347;outline-offset:3px}
.cart img{width:96px;height:96px;border-radius:10px;display:block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2)}
.cart h2{font:700 clamp(22px,6.6vw,30px)/1.05 var(--cond);font-stretch:condensed;margin:0 0 4px;overflow-wrap:anywhere;hyphens:auto}
.cart p{margin:0;color:var(--muted);font-size:15px}
.cart .stat{margin-top:6px;font-size:13px;color:var(--ink);opacity:.85}
.slot{border:2px dashed var(--edge);border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-size:15px}
.err{color:#ffb347}
@media(prefers-reduced-motion:reduce){.cart{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Spiele</h1><p class="sub">Tippen und losspielen, auch offline</p></div>
    <button class="fs" id="fs" aria-label="Vollbild" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </header>
  <div class="list" id="list"></div>
</main>
<script>
{
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stat=id=>{try{return localStorage.getItem('stat_'+id)||''}catch(e){return ''}};
const list=document.getElementById('list');
function render(games){
  list.innerHTML=games.map(g=>`<a class="cart" href="${esc(g.id)}/" style="--c:${esc(g.color||'#888')}">
      <img src="${esc(g.id)}/icon.svg" alt="">
      <div><h2>${esc(g.title)}</h2><p>${esc(g.desc||'')}</p>${stat(g.id)?`<p class="stat">${esc(stat(g.id))}</p>`:''}</div>
    </a>`).join('')+'<div class="slot">Hier kommen bald weitere Spiele dazu</div>';
}
fetch('games.json').then(r=>r.json()).then(render)
  .catch(()=>{list.innerHTML='<p class="err">Die Spieleliste konnte nicht geladen werden. Bitte einmal mit Internet öffnen.</p>'});

const fs=document.getElementById('fs'),root=document.documentElement;
fs.hidden=!(document.fullscreenEnabled||document.webkitFullscreenEnabled)||matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches;
fs.addEventListener('click',async()=>{
  try{if(document.fullscreenElement)await document.exitFullscreen();
    else{await (root.requestFullscreen||root.webkitRequestFullscreen).call(root,{navigationUI:'hide'});try{await screen.orientation.lock('portrait')}catch(e){}}
  }catch(e){fs.hidden=true}
});
addEventListener('pageshow',()=>{fetch('games.json').then(r=>r.json()).then(render).catch(()=>{})});

if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
</body>
</html>
