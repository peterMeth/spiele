<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a211a">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<title>Vier in einer Reihe</title>
<style>
/* VOICE: warm, friendly table game.  IDEA: a wooden standing frame on the kitchen table.
   PICTURE: the frame with holes, red and blue discs dropping in.  COLOUR/TYPE: walnut wood, red, ink blue; condensed system type.
   LAYOUT: icon row + status, frame fills the screen, tally and new-game button below. */
:root{color-scheme:dark;--bg:#2a211a;--ink:#f6eee3;--muted:#c3b4a2;--lib-panel:#3a2e25;--lib-edge:#55463a;--lib-ink:#f6eee3;--lib-muted:#c3b4a2;--lib-acc:#e8b04a;--lib-acc-ink:#2a1d0c}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,Roboto,sans-serif;overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.top{display:flex;gap:8px;padding:8px 10px 4px;max-width:640px;width:100%;margin:0 auto}
.st{text-align:center;font:700 24px/1.2 "Roboto Condensed","Arial Narrow",sans-serif-condensed,system-ui;padding:4px 10px;min-height:36px;display:flex;align-items:center;justify-content:center;gap:10px}
.dot{width:20px;height:20px;border-radius:50%;flex:none}
.stage{flex:1;position:relative;min-height:0;touch-action:none}
canvas{position:absolute;display:block;touch-action:none;cursor:pointer}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 14px 12px;max-width:640px;width:100%;margin:0 auto}
.tally{font-weight:600;color:var(--muted)}
.foot button{font:600 15px system-ui,Roboto,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--lib-edge);background:var(--lib-panel);color:var(--ink)}
</style>
</head>
<body>
<div class="top" id="icons"></div>
<div class="st" id="st"></div>
<div class="stage" id="stage"><canvas id="c"></canvas></div>
<div class="foot"><span class="tally" id="tally"></span><button id="again">Neue Partie</button></div>
<script src="../lib.js"></script>
<script>
{
const L=Lib,$=id=>document.getElementById(id),COLS=7,ROWS=6,COL=['#d23b2e','#2d5d8f'];
const cv=$('c'),ctx=cv.getContext('2d'),stage=$('stage');
let grid=[],turn=0,starter=0,over=true,busy=false,anim=null,winLine=null,score=[0,0],hover=-1,cell=60,pad=12,set;
const names=()=>set.mode?['Rot','Blau']:['Du','PC'];
const isAI=p=>set.mode===0&&p===1;

// ---------- rules + AI ----------
const order=[3,2,4,1,5,0,6];
const valid=g=>order.filter(c=>g[0][c]<0);
function rowFor(g,c){for(let r=ROWS-1;r>=0;r--)if(g[r][c]<0)return r;return -1}
function line4(g,r,c,p){
  for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const cells=[[r,c]];
    for(const s of[1,-1]){let rr=r+dr*s,cc=c+dc*s;while(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&g[rr][cc]===p){cells.push([rr,cc]);rr+=dr*s;cc+=dc*s}}
    if(cells.length>=4)return cells}
  return null}
function evalB(g,p){
  const o=1-p;let s=0;
  for(let r=0;r<ROWS;r++)s+=g[r][3]===p?3:g[r][3]===o?-3:0;
  const w=(a,b,c,d)=>{let mp=0,mo=0;for(const v of[a,b,c,d]){if(v===p)mp++;else if(v===o)mo++}const e=4-mp-mo;
    if(mo===0){if(mp===3)s+=5;else if(mp===2)s+=2}if(mp===0){if(mo===3)s-=4;else if(mo===2)s-=1}};
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(c<4)w(g[r][c],g[r][c+1],g[r][c+2],g[r][c+3]);
    if(r<3){w(g[r][c],g[r+1][c],g[r+2][c],g[r+3][c]);if(c<4)w(g[r][c],g[r+1][c+1],g[r+2][c+2],g[r+3][c+3]);if(c>2)w(g[r][c],g[r+1][c-1],g[r+2][c-2],g[r+3][c-3])}}
  return s}
function negamax(g,d,a,b,p){
  const cs=valid(g);if(!cs.length)return 0;if(d===0)return evalB(g,p);
  let best=-1e9;
  for(const c of cs){const r=rowFor(g,c);g[r][c]=p;const v=line4(g,r,c,p)?100000+d:-negamax(g,d-1,-b,-a,1-p);g[r][c]=-1;
    if(v>best)best=v;if(best>a)a=best;if(a>=b)break}
  return best}
function aiPick(p){
  const g=grid.map(r=>r.slice()),cs=valid(g);
  for(const c of cs){const r=rowFor(g,c);g[r][c]=p;const w=line4(g,r,c,p);g[r][c]=-1;if(w)return c}
  if(set.diff===0&&Math.random()<.4)return cs[Math.floor(Math.random()*cs.length)];
  const depth=[2,4,7][set.diff];let best=-1e9,bc=[];
  for(const c of cs){const r=rowFor(g,c);g[r][c]=p;const v=-negamax(g,depth-1,-1e9,1e9,1-p);g[r][c]=-1;
    if(v>best){best=v;bc=[c]}else if(v===best)bc.push(c)}
  return bc[Math.floor(Math.random()*bc.length)]}

// ---------- flow ----------
function status(txt){
  const n=names();$('tally').textContent=`${n[0]} ${score[0]} : ${score[1]} ${n[1]}`;
  if(txt!==undefined){$('st').innerHTML=txt;return}
  $('st').innerHTML=`<span class="dot" style="background:${COL[turn]}"></span>${isAI(turn)?'PC denkt …':n[turn]+(set.mode?' ist dran':' bist dran')}`;
}
function newGame(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(-1));turn=starter;over=false;busy=false;winLine=null;anim=null;
  L.orient('portrait');status();draw();if(isAI(turn))setTimeout(aiTurn,500);
}
function aiTurn(){if(over)return;busy=true;status();setTimeout(()=>{const c=aiPick(turn);busy=false;drop(c)},60)}
function drop(c){
  if(over||busy||anim)return;const r=rowFor(grid,c);if(r<0)return;
  busy=true;anim={c,r,y:-cell*.6,v:0,p:turn};L.beep(520,.05,'triangle',.04);
}
function landed(){
  const{c,r,p}=anim;grid[r][c]=p;anim=null;busy=false;L.beep(180,.08,'square',.06);L.vib(15);
  const w=line4(grid,r,c,p);
  if(w){over=true;winLine=w;score[p]++;const n=names();
    if(!set.mode)L.record('vier',p===0);
    status(`<span class="dot" style="background:${COL[p]}"></span>${set.mode?n[p]+' gewinnt!':(p===0?'Du gewinnst!':'Der PC gewinnt')}`);
    L.beep(p===0||set.mode?880:220,.3,'triangle',.06,p===0||set.mode?1.5:.6);starter=1-starter;return}
  if(!valid(grid).length){over=true;status('Unentschieden');starter=1-starter;return}
  turn=1-turn;status();if(isAI(turn))setTimeout(aiTurn,250);
}

// ---------- drawing ----------
function fit(){
  const r=stage.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cell=Math.floor(Math.min((r.width-16)/(COLS+.4),(r.height-8)/(ROWS+1.4)));pad=cell*.2;
  const w=COLS*cell+pad*2,h=ROWS*cell+pad*2+cell;
  cv.style.width=w+'px';cv.style.height=h+'px';cv.style.left=(r.width-w)/2+'px';cv.style.top=(r.height-h)/2+'px';
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();
}
new ResizeObserver(fit).observe(stage);
const cx=c=>pad+c*cell+cell/2,cy=r=>cell+pad+r*cell+cell/2;
function disc(x,y,p,a=1){const rad=cell*.4;ctx.globalAlpha=a;
  const g=ctx.createRadialGradient(x-rad*.35,y-rad*.35,rad*.1,x,y,rad);g.addColorStop(0,p?'#5b8cc2':'#f0705f');g.addColorStop(1,COL[p]);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rad,0,7);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,rad*.72,0,7);ctx.stroke();ctx.globalAlpha=1}
function draw(){
  const W=COLS*cell+pad*2,H=ROWS*cell+pad*2+cell;ctx.clearRect(0,0,W,H);
  if(!over&&!busy&&!anim&&!isAI(turn)&&hover>=0)disc(cx(hover),cell*.5,turn,.85);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r]&&grid[r][c]>=0)disc(cx(c),cy(r),grid[r][c]);
  if(anim)disc(cx(anim.c),cell+anim.y,anim.p);
  // wooden frame with holes (even-odd fill)
  ctx.beginPath();ctx.roundRect?ctx.roundRect(0,cell,W,H-cell,cell*.25):ctx.rect(0,cell,W,H-cell);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ctx.moveTo(cx(c)+cell*.42,cy(r));ctx.arc(cx(c),cy(r),cell*.42,0,Math.PI*2)}
  const wg=ctx.createLinearGradient(0,cell,W,H);wg.addColorStop(0,'#b7783d');wg.addColorStop(.5,'#a2672f');wg.addColorStop(1,'#8a5426');
  ctx.fillStyle=wg;ctx.fill('evenodd');
  ctx.strokeStyle='rgba(60,30,10,.35)';ctx.lineWidth=2;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ctx.beginPath();ctx.arc(cx(c),cy(r),cell*.42,0,7);ctx.stroke()}
  if(winLine){ctx.strokeStyle='#fff7d6';ctx.lineWidth=4;winLine.forEach(([r,c])=>{ctx.beginPath();ctx.arc(cx(c),cy(r),cell*.3,0,7);ctx.stroke()})}
}
let last=performance.now();
function loop(t){const dt=Math.min(.04,(t-last)/1000);last=t;
  if(anim){anim.v+=cell*40*dt;anim.y+=anim.v*dt;const tgt=pad+anim.r*cell+cell/2;if(anim.y>=tgt){anim.y=tgt;draw();landed()}}
  draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// ---------- input ----------
const colAt=e=>{const r=cv.getBoundingClientRect();const c=Math.floor((e.clientX-r.left-pad)/cell);return c>=0&&c<COLS?c:-1};
cv.addEventListener('pointermove',e=>{hover=colAt(e)});
cv.addEventListener('pointerdown',e=>{hover=colAt(e)});
cv.addEventListener('pointerup',e=>{const c=colAt(e);if(c>=0&&!isAI(turn))drop(c)});
cv.addEventListener('pointerleave',()=>{hover=-1});
addEventListener('keydown',e=>{
  if(/^[1-7]$/.test(e.key)&&!isAI(turn))drop(+e.key-1);
  else if(e.key==='ArrowLeft')hover=Math.max(0,(hover<0?3:hover)-1);
  else if(e.key==='ArrowRight')hover=Math.min(6,(hover<0?3:hover)+1);
  else if((e.key==='Enter'||e.key===' ')&&hover>=0&&!isAI(turn)){e.preventDefault();drop(hover)}
});
$('again').onclick=()=>newGame();

const menu=L.menu({prefix:'vier_',title:'Vier in einer Reihe',
  text:'Lass deine Steine in die Spalten fallen. Wer zuerst vier in einer Reihe hat, waagerecht, senkrecht oder schräg, gewinnt.',
  rows:[{key:'mode',label:'Modus',opts:[['Gegen PC',0],['1 vs 1',1]],def:0},{key:'diff',label:'PC',opts:[['Leicht',0],['Mittel',1],['Schwer',2]],def:1,showIf:s=>s.mode===0}],
  onStart:s=>{score=[0,0];starter=0;newGame()}});
set=menu.settings;
L.icons($('icons'),{onMenu:()=>{over=true;menu.show()},orient:'portrait'});
grid=Array.from({length:ROWS},()=>Array(COLS).fill(-1));status('');fit();
}
</script>
</body>
</html>
